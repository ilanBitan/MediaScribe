<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OriginAI | Transcription</title>

    <style>
        /* Keep styling local so the page needs no external assets. */
        :root {
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f3f5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 20px;
        }

        main {
            max-width: 760px;
            margin: auto;
        }

        .brand {
            color: #4f46e5;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 44px);
            margin-bottom: 12px;
        }

        .description, .hint {
            color: #596579;
            line-height: 1.6;
        }

        .card {
            background: white;
            padding: 28px;
            margin-top: 24px;
            border: 1px solid #dde3ee;
            border-radius: 16px;
            box-shadow: 0 8px 30px #17203308;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 12px;
        }

        input[type="file"] {
            width: 100%;
            padding: 18px;
            border: 2px dashed #c7cde0;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        button:focus-visible, input:focus-visible {
            outline: 3px solid #818cf8;
            outline-offset: 3px;
        }

        .hint {
            font-size: 14px;
        }

        #status {
            min-height: 24px;
            margin-top: 20px;
        }

        #status[data-state="error"] {
            color: #b42318;
        }

        #status[data-state="success"] {
            color: #166534;
        }

        #metadata {
            color: #596579;
            line-height: 1.6;
        }

        #transcript {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.8;
            padding: 18px;
            background: #f7f8fc;
            border-radius: 8px;
        }

        /* Keep hidden sections hidden regardless of other styling. */
        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
<main>
    <p class="brand">ORIGINAI</p>
    <h1>Turn speech into text.</h1>
    <p class="description">
        Upload a media file and get a transcript you can copy.
    </p>

    <section class="card" aria-label="Upload media">
        <form id="upload-form">
            <label for="media-file">Choose a media file</label>

            <!-- accept guides file selection; server validation is still required. -->
            <input
                id="media-file"
                name="file"
                type="file"
                accept="audio/*,video/*,.m4a"
                aria-describedby="file-hint"
                required
            >

            <p id="file-hint" class="hint">
                Maximum file size: 25 MiB. Short recordings work best.
                Mixed-language speech may produce inaccurate results.
            </p>

            <button id="submit-button" type="submit">
                Transcribe
            </button>
        </form>

        <!-- Announce status changes to assistive technologies. -->
        <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="card" aria-labelledby="result-title" hidden>
        <h2 id="result-title">Your transcript</h2>
        <p id="metadata"></p>

        <!-- Automatic direction supports both English and Hebrew text. -->
        <p id="transcript" dir="auto"></p>

        <button id="copy-button" type="button" disabled>
            Copy transcript
        </button>
    </section>
</main>

<script>
    // Cache DOM references once instead of looking them up repeatedly.
    const form = document.querySelector("#upload-form");
    const fileInput = document.querySelector("#media-file");
    const submitButton = document.querySelector("#submit-button");
    const statusMessage = document.querySelector("#status");
    const resultSection = document.querySelector("#result");
    const transcript = document.querySelector("#transcript");
    const metadata = document.querySelector("#metadata");
    const copyButton = document.querySelector("#copy-button");

    const MAX_FILE_SIZE_BYTES = 25 * 1024 * 1024;
    let isProcessing = false;

    function setStatus(message, state = "") {
        // Use textContent so messages are treated as text, never executable HTML.
        statusMessage.textContent = message;
        statusMessage.dataset.state = state;
    }

    function clearResult() {
        resultSection.hidden = true;
        transcript.textContent = "";
        metadata.textContent = "";
        copyButton.disabled = true;
        copyButton.textContent = "Copy transcript";
    }

    fileInput.addEventListener("change", () => {
        // Clear the previous result when a different file is selected.
        clearResult();
        setStatus("");
    });

    form.addEventListener("submit", async (event) => {
        // Handle submission with JavaScript instead of reloading the page.
        event.preventDefault();

        if (isProcessing) {
            return;
        }

        clearResult();

        const file = fileInput.files[0];

        if (!file) {
            setStatus("Please choose a media file.", "error");
            return;
        }

        // Client checks give quick feedback; the server enforces its own limits.
        if (file.size === 0) {
            setStatus("The selected file is empty.", "error");
            return;
        }

        if (file.size > MAX_FILE_SIZE_BYTES) {
            setStatus("The file exceeds the 25 MiB size limit.", "error");
            return;
        }

        // FormData creates the multipart upload expected by the API.
        const body = new FormData();
        body.append("file", file);

        isProcessing = true;
        submitButton.disabled = true;
        fileInput.disabled = true;
        submitButton.textContent = "Transcribing…";
        form.setAttribute("aria-busy", "true");
        setStatus("Uploading and transcribing. This may take a moment.");

        try {
            // A relative URL keeps the UI and API on the same origin.
            // Let the browser set the multipart Content-Type and boundary.
            const response = await fetch("/transcriptions", {
                method: "POST",
                body: body,
            });

            // Handle non-JSON server responses without losing error feedback.
            const data = await response.json().catch(() => null);

            if (!response.ok) {
                const message =
                    typeof data?.detail === "string"
                        ? data.detail
                        : `Transcription failed (HTTP ${response.status}).`;

                throw new Error(message);
            }

            if (!data || typeof data.text !== "string") {
                throw new Error("The server returned an unexpected response.");
            }

            // Never insert model output with innerHTML.
            transcript.textContent =
                data.text || "No speech was transcribed.";

            metadata.textContent =
                `Language: ${data.language} · ` +
                `Audio: ${data.audio_duration_seconds.toFixed(1)} s · ` +
                `Processing: ${data.processing_time_seconds.toFixed(1)} s`;

            copyButton.disabled = data.text.length === 0;
            resultSection.hidden = false;
            setStatus("Transcription complete.", "success");

        } catch (error) {
            // Fetch uses TypeError for common network failures.
            const message = error instanceof TypeError
                ? "Could not reach the server. Check that it is running."
                : error.message;

            setStatus(message, "error");

        } finally {
            // Restore the form after both successful and failed requests.
            isProcessing = false;
            submitButton.disabled = false;
            fileInput.disabled = false;
            submitButton.textContent = "Transcribe";
            form.removeAttribute("aria-busy");
        }
    });

    copyButton.addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(transcript.textContent);
            copyButton.textContent = "Copied!";
        } catch {
            setStatus(
                "Could not copy automatically. Select and copy the text manually.",
                "error"
            );
        }
    });
</script>
</body>
</html>
